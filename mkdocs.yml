site_name: Andy 的知識庫
site_description: 個人知識管理 — 教學、會考分析、投資、YouTube
site_author: Andy Cheng
site_url: https://andyjunyi.github.io/knowledge-base/

theme:
  name: material
  language: zh-TW
  icon:
    logo: material/book-open-variant
    favicon: material/book-open-variant
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切換淺色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - footnotes

plugins:
  - search:
      lang: zh

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@dwhsvideo
      name: YouTube 頻道
  generator: false

copyright: Copyright &copy; 2026 Andy Cheng

